name: agent-bridge (hosted)

# GitHub's machines as one more worker for the git queue in tasks/.
#
# It drains tasks marked `--env hosted`: browsing and compute that need no login of yours. It is
# deliberately NOT the path for Gemini or ChatGPT — those want a signed-in profile, and this
# runner has none (nor should it: a datacenter IP holding someone's session cookie is how accounts
# die). The signed-in work belongs to the worker on your own machine, which attaches to the browser
# you are already logged into. See agent_bridge_local.yml for that shape, and tools/README.md for
# the runbook.
#
# What it is genuinely useful for: a queue you can kick from the web UI or by pushing a file,
# results that arrive as commits (so an agent with no inbound port and a filtered egress still gets
# them), and a fresh browser per run — the only honest way to look at a public page.
#
# Two rules this file exists to obey:
#
# 1. Anything worth knowing must reach either the branch or an annotation. Actions writes its log
#    body to a blob store that a sandbox with a short egress allowlist cannot read at all, so
#    "check the log" is not advice anyone can follow from here. The queue reports per-task failures
#    through tasks/done/, a crashing worker reports itself through tasks/HEARTBEAT.json, and this
#    step reports its own exit code plus the tail of stderr as a ::error:: annotation, which the
#    REST API does serve: gh api /repos/<repo>/check-runs/<job id>/annotations
#  2. Actions runs `run:` blocks under `bash -e`, so any command that merely *fails* ends the step.
#    The drain therefore runs with errexit off, and decides its own exit code.

on:
  workflow_dispatch:
    inputs:
      prompt:
        description: "Prompt to queue (leave empty to only drain what is already queued)"
        required: false
        type: string
      platform:
        description: "Adapter to run it with"
        required: false
        type: choice
        default: gemini
        options: [gemini, chatgpt]
      mode:
        description: "Adapter mode"
        required: false
        type: choice
        default: image
        options: [image, research]
      env:
        description: "Which worker may take it — local means your own machine will do the work"
        required: false
        type: choice
        default: hosted
        options: [hosted, local]
  push:
    paths:
      - "tasks/pending/**"

permissions:
  contents: write

concurrency:
  group: agent-bridge-hosted
  cancel-in-progress: false

jobs:
  drain:
    name: run what a stranger can run
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PROMPT: ${{ inputs.prompt }}
      PLATFORM: ${{ inputs.platform }}
      MODE: ${{ inputs.mode }}
      TARGET_ENV: ${{ inputs.env }}
      BRANCH: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: identity for the commits we push back
        run: |
          git config user.name "vito-bridge"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config pull.rebase true
          git remote set-url --push origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: "playwright, and the browser it happens to have installed"
        run: |
          python -m pip install --quiet --upgrade pip playwright
          python -m playwright --version
          python -m playwright install chromium
          ls -1 "$HOME/.cache/ms-playwright" || echo "no browser cache at all"

      - name: queue the dispatched prompt
        if: ${{ github.event_name == 'workflow_dispatch' && env.PROMPT != '' }}
        run: |
          python3 tools/gh_bridge.py --branch "$BRANCH" ask \
            --platform "${PLATFORM:-gemini}" \
            --prompt "$PROMPT" \
            --mode "${MODE:-image}" \
            --env "${TARGET_ENV:-hosted}" \
            --no-wait

      - name: drain this runner's share of the queue
        run: |
          set +e
          # The worker launches the browser itself, through the same code path a laptop uses:
          # CHROME_PATH is the only hint it needs, and --launch-wait covers a cold profile. Fewer
          # shell lines means fewer ways for a step to die before the queue gets an answer.
          export CHROME_PATH=$(ls -d "$HOME/.cache/ms-playwright"/chromium-*/chrome-linux/chrome 2>/dev/null | head -1)
          [ -n "$CHROME_PATH" ] || echo "::warning::no chromium from playwright — the worker will report each task's own failure"
          python3 tools/gh_bridge.py --branch "$BRANCH" worker \
            --once --env hosted \
            --cdp-url http://127.0.0.1:9222 \
            --profile /tmp/chrome-hosted --launch-wait 60 \
            --no-check-endpoint --heartbeat 0 \
            >/tmp/drain.json 2>/tmp/drain.err
          rc=$?
          cat /tmp/drain.json
          sed 's/^/[tools] /' /tmp/drain.err
          tail -c 1200 /tmp/drain.err | tr '\n' '~' | sed 's/~/\%0A/g' | sed 's/^/::error::drain exited '"$rc"' :: /'
          exit $rc

      - name: what the queue looks like now
        if: always()
        run: python3 tools/gh_bridge.py --branch "$BRANCH" status || true

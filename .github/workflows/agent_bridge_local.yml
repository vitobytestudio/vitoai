name: agent-bridge (my machine)

# The same worker, on hardware that has a logged-in browser.
#
# This file only ever runs if you have registered a machine as a self-hosted runner with the label
# `vito-bridge` (Settings → Actions → Runners → New self-hosted runner). Until then, GitHub keeps
# the job **queued** and nothing on your machine happens — which is why this lives in its own file
# rather than as a second job in agent_bridge.yml: a workflow that hangs forever is a worse
# experience than one you have to opt into.
#
# Be honest with yourself about what you are agreeing to: a self-hosted runner executes whatever the
# workflow says, on your machine, with your browser profiles. If that is more reach than you want
# to give a repository, skip Actions entirely and run the worker yourself — it is the same code, the
# same queue, and nothing can trigger it except a commit you pushed:
#
#     python3 tools/gh_bridge.py worker
#
# The Actions leg adds exactly one thing: a prompt typed into the GitHub UI reaches a machine behind
# NAT without you logging into it.
#
# Triggers, deliberately: `workflow_dispatch` only. This file used to fire on `push: tasks/pending/**`
# and on a cron, and the first real test of that produced a job **pending forever** — a self-hosted
# job with no runner online does not fail, it waits (24 hours, then GitHub cancels it), and a
# starved queue looks identical to a slow one. A machine that is supposed to be listening should poll
# the branch on its own (`tools/gh_bridge.py worker` under launchd/systemd); a workflow you press is
# for the times you are standing in front of it.

on:
  workflow_dispatch:
    inputs:
      prompt:
        description: "Prompt to queue"
        required: false
        type: string
      platform:
        description: "Adapter"
        required: false
        type: choice
        default: gemini
        options: [gemini, chatgpt]
      mode:
        description: "Adapter mode"
        required: false
        type: choice
        default: image
        options: [image, research]
      visible:
        description: "Show the browser (for signing in or getting past a check)"
        required: false
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: agent-bridge-local-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  serve:
    name: claim, run, push back
    runs-on: [self-hosted, vito-bridge]
    timeout-minutes: 45
    env:
      PROMPT: ${{ inputs.prompt }}
      PLATFORM: ${{ inputs.platform }}
      MODE: ${{ inputs.mode }}
      VISIBLE: ${{ inputs.visible }}
      BRANCH: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          clean: false

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: the only dependency
        run: python -m pip install --quiet --upgrade pip playwright

      - name: identity for the commits we push back
        run: |
          git config user.name || git config user.name "$(whoami) (self-hosted)"
          git config user.email || git config user.email "$(whoami)@$(hostname)"
          git config pull.rebase true

      - name: queue the dispatched prompt
        if: ${{ github.event_name == 'workflow_dispatch' && env.PROMPT != '' }}
        run: |
          python3 tools/gh_bridge.py --branch "$BRANCH" ask \
            --platform "${PLATFORM:-gemini}" --prompt "$PROMPT" \
            --mode "${MODE:-image}" --env local --no-wait

      - name: drain the local queue
        run: |
          set -uo pipefail
          FLAGS="--once --env local --heartbeat 0"
          if [ "${VISIBLE:-false}" = "true" ]; then FLAGS="$FLAGS --visible"; fi
          # The worker attaches to Chrome; it never drives a browser it did not start, and it
          # starts one only when nothing answers the port. Chrome 136+ ignores the debug port on
          # the default profile, hence the dedicated --profile; sign into it once (the persistent
          # profile keeps the session), then run headless.
          python3 tools/gh_bridge.py --branch "$BRANCH" worker $FLAGS
        env:
          CHROME_PROFILE: ${{ github.workspace }}/.chrome-cdp

      - name: what the queue looks like now
        if: always()
        run: python3 tools/gh_bridge.py --branch "$BRANCH" status || true
